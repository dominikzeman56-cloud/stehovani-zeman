name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Lockfile is npm 11. npm 10 (bundled with Node 22) fails `npm ci`
      # on an optional peer it wants locked: lru-cache@11.5.3.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
